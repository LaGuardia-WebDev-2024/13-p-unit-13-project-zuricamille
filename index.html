<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 13 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>Quiz About Zuri</h1>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTadtxXyVjVDyg7TfbT8FJIdGSXdrT3ex9yqQ&s"
      width="400"
      height="400"/>
    
    <hr />
    
    <!-- Lash Question -->
    <form id="lash-form">
      <label>
        👁 What is my favorite lash style?
        <select id="lash-answer">
          <option value="lash1">Doll Eye</option>
          <option value="lash2">Cat Eye</option>
          <option value="lash3">Fox Eye</option>
          <option value="lash4">Hybrid Set</option>
        </select>
      </label>
      <button type="submit">Check Lash Style Answer</button>
    </form>
    <div id="lash-result"></div>
    <img id="lash-Image" src="https://s3-media0.fl.yelpcdn.com/bphoto/FD-aolVtjZtoDqVRF3w9HQ/1000s.jpg" style="display:hide;" alt="Lash Image" width="250" lengh="300" />
    
    <hr />
   
    <!-- Dance Question -->
    <form id="Dance-form">
      <label>
        💃What is my favorite dance genre?
        <select id="dance-answer">
          <option value="dance1">Ballet</option>
          <option value="dance2">Modern</option>
          <option value="dance3">Contemporary</option>
          <option value="dance4">Hip Hop</option>
        </select>
      </label>
      <button type="submit">Check Dance Genre Answer</button>
    </form>
    <div id="dance-result"></div>
    <img id="dance-img" src="https://www.shutterstock.com/image-vector/silhouette-dancers-simple-260nw-302757734.jpg" style="display:hide;" alt="Dance Image"/>
        
    <!-- Food Question -->
    <form id="Food-form">
      <label>
        🍽 What is my favorite Food?
        <select id="food-answer">
          <option value="food1">Pizza</option>
          <option value="food2">Rice + Beans</option>
          <option value="food3">Burritos</option>
          <option value="food4">French Fries</option>
        </select>
      </label>
      <button type="submit">Check Food Answer</button>
    </form>
    <div id="food-result"></div>
    <img id="food-img"
    src="https://elavegan.com/wp-content/uploads/2020/03/spanish-rice-and-red-beans-in-a-bowl.jpg"
    width="250" height="300"/>
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      //Lash Question jQuery Code
      $("#lash-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#lash-answer");
        var answer = $answer.val();
        var $lashResult = $("#lash-result");
        var $lashImage = $("#lash-image");

        if (answer === "lash2") {
          $lash-result.text("That is Correct!");
          
        } else {
          $lash-result.text("Try Again!");
        }
      });

      //Dance Question jQuery Code
      $("#dance-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#dance-answer");
        var answer = $answer.val();

        if (answer === "dance4") {
          $dance-result.text("Yes! You Got It");
        } else {
          $dance-result.text("Try Again!");
        }
      });
      
      //Food Question jQuery Code
      $("#food-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#dance-answer");
        var answer = $answer.val();

        if (answer === "food2") {
          $("#food-result").text("Yes! Correct");
        } else {
          $("#food-result").text("Try Again!");
        }
      });
    </script>
  </body>

  <!--- Taken From Khan Academy HTML/JS: Making webpages interactive with jQuery-->
</html>
